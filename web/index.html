<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Browser UI tint (Flutter web does not apply SystemChrome native overlays.) -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5FAF8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="plantastic">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>plantastic</title>
  <!--
    Omit <link rel="manifest">: Vercel preview URLs with Deployment Protection
    often return 401 for manifest fetch (Chrome still loads the SPA). Theme /
    icons use meta + apple-touch-icon above; manifest.json remains in web/ for hosts
    that support public PWA install without that issue.
  -->

  <style>
    #plantastic-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.25rem;
      margin: 0;
      background: linear-gradient(165deg, #f5faf8 0%, #eef6f1 45%, #e8f2ec 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
    }

    #plantastic-splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      text-align: center;
      padding: 1.5rem;
    }

    .splash-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 3px solid rgba(46, 125, 50, 0.18);
      border-top-color: #2e7d32;
      animation: plantastic-spin 0.85s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-spinner {
        animation: none;
        border-top-color: #2e7d32;
        opacity: 0.85;
      }
    }

    @keyframes plantastic-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .splash-title {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1b4332;
    }

    .splash-sub {
      margin: 0;
      font-size: 0.875rem;
      font-weight: 500;
      color: rgba(27, 67, 50, 0.62);
    }
  </style>
</head>
<body>
  <div id="plantastic-splash" aria-busy="true" aria-live="polite">
    <div class="splash-inner">
      <div class="splash-spinner" aria-hidden="true"></div>
      <p class="splash-title">Plantastic</p>
      <p class="splash-sub">Loading…</p>
    </div>
  </div>

  <script>
    (function () {
      var splash = document.getElementById("plantastic-splash");
      function hideSplash() {
        if (!splash || splash.classList.contains("splash-hidden")) return;
        splash.classList.add("splash-hidden");
        splash.setAttribute("aria-busy", "false");
        splash.addEventListener(
          "transitionend",
          function () {
            splash.remove();
          },
          { once: true }
        );
        window.setTimeout(function () {
          if (splash && splash.parentNode) splash.remove();
        }, 600);
      }
      window.addEventListener("flutter-first-frame", hideSplash);
      window.setTimeout(function () {
        hideSplash();
      }, 45000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
